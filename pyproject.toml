[project]
name = "document-agent"
version = "0.1.0"
description = "An OpenHands plugin that writes product documentation (README, user manual, technical reference) with sister-agent inquiries and user interviews"
requires-python = ">=3.12"
license = "BSD-3-Clause"
dependencies = []

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.10",
    "pyright==1.1.414",
    "pytest-cov==7.1.0",
    "pytest-xdist>=3",
]
sdk-check = ["openhands-sdk==1.52.0", "openhands-tools==1.52.0"]

[tool.uv]
default-groups = ["dev"]
required-version = "==0.12.23"

[tool.ruff]
line-length = 88
# Canonical shared copies are guarded by scripts/check_shared_hooks.py.
extend-exclude = ["plugins/doc/hooks/scripts/_records.py", "plugins/doc/hooks/scripts/require_records.py"]
target-version = "py312"
src = ["plugins/doc/skills/doc-lint/scripts", "plugins/doc/hooks/scripts", "plugins/doc/scripts", "scripts", "tests"]

[tool.ruff.format]
# Family-canonical files are byte-identical across repos (formatted at 88).
exclude = ["scripts/structural_coverage.py", "tests/test_structural_coverage.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["plugins/doc/skills/doc-lint/scripts", "plugins/doc/hooks/scripts", "plugins/doc/scripts", "scripts", "tests"]
exclude = ["**/__pycache__", "**/.venv"]
extraPaths = ["plugins/doc/hooks/scripts", "plugins/doc/scripts", "plugins/doc/skills/doc-lint/scripts"]
# The brief JSON boundary is intentionally untyped; strict Unknown-reporting
# would only repeat what the validator already checks at runtime.
reportUnknownArgumentType = false
reportUnknownLambdaType = false
reportUnknownMemberType = false
reportUnknownParameterType = false
reportUnknownVariableType = false
reportMissingParameterType = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-rs -n auto --dist loadgroup"

[tool.coverage.run]
source = ["plugins/doc"]
branch = true

[tool.vibebb-coverage]
# Ratchet floors (percent) for scripts/structural_coverage.py, measured on
# main minus one point for interpreter variance. Raise them, never lower.
c0 = 85
c1 = 79
decision = 60
c2 = 55
mcdc = 36
boundary = 36

[tool.coverage.report]
fail_under = 83
