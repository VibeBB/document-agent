[project]
name = "document-agent"
version = "0.1.0"
description = "An OpenHands plugin that writes product documentation (README, user manual, technical reference) with sister-agent inquiries and user interviews"
requires-python = ">=3.12"
license = "BSD-3-Clause"
dependencies = []

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.3",
    "pyright==1.1.414",
    "pytest-cov==7.1.0",
    "pytest-xdist>=3",
]
sdk-check = ["openhands-sdk==1.59.0", "openhands-tools==1.59.0"]

[tool.uv]
default-groups = ["dev"]
required-version = "==0.13.6"

[tool.ruff]
line-length = 88
# Canonical shared copies are guarded by scripts/check_shared_hooks.py.
extend-exclude = ["plugins/doc/hooks/scripts/_records.py", "plugins/doc/hooks/scripts/require_records.py", "plugins/doc/hooks/scripts/blind_guard.py"]
target-version = "py312"
src = ["plugins/doc/skills/doc-lint/scripts", "plugins/doc/hooks/scripts", "plugins/doc/scripts", "scripts", "tests"]

[tool.ruff.format]
# Family-canonical files are byte-identical across repos (formatted at 88).
exclude = [
  "scripts/mutation_probe.py",
  "scripts/structural_coverage.py",
  "tests/test_mutation_probe.py",
  "tests/test_structural_coverage.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Ported from wire-agent tests/test_records.py; fixtures keep wire's line widths.
"tests/test_doc_records.py" = ["E501"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["plugins/doc/skills/doc-lint/scripts", "plugins/doc/hooks/scripts", "plugins/doc/scripts", "scripts", "tests"]
exclude = ["**/__pycache__", "**/.venv"]
extraPaths = ["plugins/doc/hooks/scripts", "plugins/doc/scripts", "plugins/doc/skills/doc-lint/scripts"]
# The brief JSON boundary is intentionally untyped; strict Unknown-reporting
# would only repeat what the validator already checks at runtime.
reportUnknownArgumentType = false
reportUnknownLambdaType = false
reportUnknownMemberType = false
reportUnknownParameterType = false
reportUnknownVariableType = false
reportMissingParameterType = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-rs -n auto --dist loadgroup"

[tool.coverage.run]
source = ["plugins/doc"]
branch = true

[tool.vibebb-coverage]
# Ratchet floors (percent) for scripts/structural_coverage.py, measured on
# main (after VRP v2 vendored the canonical hook core) minus one point for
# interpreter variance. Raise them, never lower.
c0 = 83
c1 = 73
decision = 55
c2 = 51
mcdc = 30
boundary = 43

[tool.vibebb-mutation]
# Advisory weekly mutation probe (scripts/mutation_probe.py); never a gate.
targets = ["plugins/doc/skills/doc-lint/scripts/doc_lint.py", "plugins/doc/scripts/doc_figures.py"]
tests = ["tests/test_doc_lint.py", "tests/test_doc_figures.py", "tests/test_doc_boundaries.py"]
max_mutants = 400

[tool.coverage.report]
fail_under = 80
