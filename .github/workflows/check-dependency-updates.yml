name: Dependency update check

on:
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-dependency-updates
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read # actions/checkout
      issues: write # creates/edits/closes the dependency-updates report issue
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: setup-uv-1
        continue-on-error: true
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          cache-suffix: report
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        if: steps.setup-uv-1.outcome == 'failure'
        with:
          python-version: "3.12"
          cache-suffix: report
      - name: Sync dependencies
        run: uv sync --locked
      - name: Collect update candidates
        id: collect
        env:
          REPORT_DIR: ${{ runner.temp }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          report_md="$REPORT_DIR/report.md"
          report_json="$REPORT_DIR/report.json"
          uv run python scripts/check_dependency_updates.py \
            --markdown "$report_md" --json "$report_json"
          printf '\n\n[Workflow run](%s)\n' "$RUN_URL" >> "$report_md"
          cat "$report_md" >> "$GITHUB_STEP_SUMMARY"
          outdated=$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["outdated_count"])' "$report_json")
          unknown_count=$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["unknown_count"])' "$report_json")
          echo "outdated=$outdated" >> "$GITHUB_OUTPUT"
          echo "unknown_count=$unknown_count" >> "$GITHUB_OUTPUT"
      - name: Post report to issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT_PATH: ${{ runner.temp }}/report.md
          OUTDATED: ${{ steps.collect.outputs.outdated }}
          UNKNOWN_COUNT: ${{ steps.collect.outputs.unknown_count }}
        run: |
          # gh issue create fails with "could not add label" when the label
          # does not exist (observed before the first report issue landed).
          gh label create dependency-updates --repo "$GITHUB_REPOSITORY" \
            --color 0366d6 --description "Dependency update report" --force
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --label dependency-updates \
            --search "in:title Dependency update check report" \
            --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue edit "$number" --repo "$GITHUB_REPOSITORY" --body-file "$REPORT_PATH"
          else
            number=$(gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "Dependency update check report" \
              --label dependency-updates --body-file "$REPORT_PATH" | sed 's#.*/##')
          fi
          if [ "$OUTDATED" = "0" ] && [ "$UNKNOWN_COUNT" = "0" ] && [ -n "$number" ]; then
            gh issue close "$number" --repo "$GITHUB_REPOSITORY" \
              --comment "All checked dependencies are current."
          fi
