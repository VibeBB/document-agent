name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      ref:
        type: string
        required: false
        default: ""
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Superseded pull_request runs are cancelled; main pushes and dispatched
  # runs are never cancelled so in-flight main verification always lands.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
          disable-telemetry: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Cache uv-managed CPython
        id: cache-uv-managed-cpython
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/uv-python
          key: uv-python-${{ runner.os }}-${{ matrix.python-version }}
      - name: Point uv Python installs at the cached path
        id: point-uv-python-installs-at-the-cached-path
        # UV_PYTHON_INSTALL_DIR lands under _temp on the hosted image,
        # outside the uv dependency cache, so each leg re-downloaded CPython.
        run: echo "UV_PYTHON_INSTALL_DIR=$RUNNER_TEMP/uv-python" >> "$GITHUB_ENV"
      - id: setup-uv-1
        continue-on-error: true
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ matrix.python-version }}
          cache-suffix: verify-${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        id: setup-uv
        if: steps.setup-uv-1.outcome == 'failure'
        with:
          python-version: ${{ matrix.python-version }}
          cache-suffix: verify-${{ matrix.python-version }}
      - name: Sync dependencies
        id: sync-dependencies
        # sdk-check installs openhands-sdk/tools so
        # tests/test_plugin_assets.py::test_sdk_plugin_load exercises the
        # real plugin load instead of skipping on importorskip.
        run: uv sync --locked --group sdk-check
      - name: Ruff
        id: ruff
        background: true
        # pyproject pins both tools to py312 — one leg covers lint/type-check.
        if: matrix.python-version == '3.12'
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Pyright
        id: pyright
        background: true
        if: matrix.python-version == '3.12'
        run: uv run pyright
      - name: Check shared hooks
        id: check-shared-hooks
        background: true
        run: uv run python scripts/check_shared_hooks.py
      - name: Check shared workflows
        id: check-shared-workflows
        background: true
        run: uv run python scripts/check_shared_workflows.py
      - name: Pytest
        id: pytest
        background: true
        run: uv run python scripts/structural_coverage.py run --json out/structural-coverage.json
      - name: Verify docs
        id: verify-docs
        background: true
        run: uv run python scripts/verify_docs.py
      - name: Lint shipped example
        id: lint-shipped-example
        background: true
        run: >
          uv run python plugins/doc/skills/doc-lint/scripts/doc_lint.py
          --root plugins/doc/skills/doc-lint/examples/desk-timer
          --brief plugins/doc/skills/doc-lint/examples/desk-timer/doc-work/desk-timer/doc-brief.json
          --no-write
      - name: Lint shipped launch example
        id: lint-shipped-launch-example
        background: true
        run: >
          uv run python plugins/doc/skills/doc-lint/scripts/doc_lint.py
          --root plugins/doc/skills/doc-lint/examples/desk-timer-launch
          --brief plugins/doc/skills/doc-lint/examples/desk-timer-launch/doc-work/desk-timer/doc-brief.json
          --no-write

      # The legs above run as background steps, so they stay top-level
      # rather than a parallel group. Join them here so its outcome reads
      # are populated.
      - name: Wait for check legs
        wait-all:

  # Forward-compatibility canary ahead of the next stable release. Runs
  # sequentially: a tolerated step failure inside a background leg can end
  # the run as failure even when every job is green (observed on main),
  # so the canary keeps ordinary steps plus per-step continue-on-error
  # and reports failures as an annotation instead.
  canary:
    name: verify (3.15)
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    env:
      # The canary leg builds sdists (e.g. fastuuid's pinned PyO3)
      # against a pre-release CPython; abi3 forward-compat mode lets
      # the wheel target the stable ABI instead of refusing at build
      # time.
      PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
          disable-telemetry: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Cache uv-managed CPython
        id: cache-uv-managed-cpython
        continue-on-error: true
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/uv-python
          key: uv-python-${{ runner.os }}-3.15
      - name: Point uv Python installs at the cached path
        id: point-uv-python-installs-at-the-cached-path
        continue-on-error: true
        run: echo "UV_PYTHON_INSTALL_DIR=$RUNNER_TEMP/uv-python" >> "$GITHUB_ENV"
      - id: setup-uv-1
        continue-on-error: true
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.15"
          cache-suffix: verify-3.15
          # The canary's uv sync always fails while deps lack 3.15
          # wheels; a cache would only rewrite half-built sdists
          # against the repo's 10 GB cache budget.
          enable-cache: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        id: setup-uv
        continue-on-error: true
        if: steps.setup-uv-1.outcome == 'failure'
        with:
          python-version: "3.15"
          cache-suffix: verify-3.15
          # The canary's uv sync always fails while deps lack 3.15
          # wheels; a cache would only rewrite half-built sdists
          # against the repo's 10 GB cache budget.
          enable-cache: false
      - name: Sync dependencies
        id: sync-dependencies
        continue-on-error: true
        run: uv sync --locked --group sdk-check
      - name: Check shared hooks
        id: check-shared-hooks
        continue-on-error: true
        run: uv run python scripts/check_shared_hooks.py
      - name: Check shared workflows
        id: check-shared-workflows
        continue-on-error: true
        run: uv run python scripts/check_shared_workflows.py
      - name: Pytest
        id: pytest
        continue-on-error: true
        run: uv run python scripts/structural_coverage.py run --json out/structural-coverage.json
      - name: Verify docs
        id: verify-docs
        continue-on-error: true
        run: uv run python scripts/verify_docs.py
      - name: Lint shipped example
        id: lint-shipped-example
        continue-on-error: true
        run: >
          uv run python plugins/doc/skills/doc-lint/scripts/doc_lint.py
          --root plugins/doc/skills/doc-lint/examples/desk-timer
          --brief plugins/doc/skills/doc-lint/examples/desk-timer/doc-work/desk-timer/doc-brief.json
          --no-write
      - name: Lint shipped launch example
        id: lint-shipped-launch-example
        continue-on-error: true
        run: >
          uv run python plugins/doc/skills/doc-lint/scripts/doc_lint.py
          --root plugins/doc/skills/doc-lint/examples/desk-timer-launch
          --brief plugins/doc/skills/doc-lint/examples/desk-timer-launch/doc-work/desk-timer/doc-brief.json
          --no-write
      - name: Report 3.15 canary outcome
        if: always() && (steps.cache-uv-managed-cpython.outcome == 'failure' || steps.point-uv-python-installs-at-the-cached-path.outcome == 'failure' || steps.setup-uv.outcome == 'failure' || steps.sync-dependencies.outcome == 'failure' || steps.check-shared-hooks.outcome == 'failure' || steps.check-shared-workflows.outcome == 'failure' || steps.pytest.outcome == 'failure' || steps.verify-docs.outcome == 'failure' || steps.lint-shipped-example.outcome == 'failure' || steps.lint-shipped-launch-example.outcome == 'failure')
        run: |
          echo "::warning::Python 3.15 canary leg failed — forward-compat signal, not a gate failure"
  plugin-load:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
          disable-telemetry: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Cache uv-managed CPython
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/uv-python
          # A per-job key: verify (3.12) and plugin-load would otherwise race
          # to save the same 'uv-python-Linux-3.12' entry on a cold epoch.
          key: uv-python-${{ runner.os }}-3.12-plugin-load
      - name: Point uv Python installs at the cached path
        run: echo "UV_PYTHON_INSTALL_DIR=$RUNNER_TEMP/uv-python" >> "$GITHUB_ENV"
      - id: setup-uv-2
        continue-on-error: true
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.14"
          cache-suffix: plugin-load
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        if: steps.setup-uv-2.outcome == 'failure'
        with:
          python-version: "3.14"
          cache-suffix: plugin-load
      - name: Sync dependencies
        run: uv sync --locked --group sdk-check
      - name: Check plugin loads via SDK
        run: uv run --group sdk-check python scripts/check_plugin_load.py
